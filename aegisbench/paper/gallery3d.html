<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #10161b; font-family: Manrope, sans-serif; color: #eef2ef; }
  canvas { position: absolute; left: 0; top: 0; }
  .head { position: absolute; left: 72px; top: 60px; }
  h1 { margin: 0 0 10px; font-size: 52px; font-weight: 800; }
  .sub { font-size: 24px; font-weight: 500; color: #b9c6c0; }
  .tag { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; }
  .tag b { display: block; font-size: 38px; font-weight: 800; }
  .tag span { display: block; font-size: 18px; font-weight: 700; color: #b9c6c0; background: rgba(16,22,27,0.8); padding: 3px 10px; border-radius: 6px; margin-top: 4px; }
  .pk { position: absolute; transform: translate(-50%, -50%); font: 500 17px "JetBrains Mono", monospace; color: #eef2ef; background: rgba(16,22,27,0.78); padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .foot { position: absolute; left: 72px; bottom: 48px; font-size: 20px; font-weight: 700; color: #d9a54a; }
</style>
</head>
<body>
<div class="head"><h1 id="t"></h1><div class="sub" id="s"></div></div>
<div class="foot" id="f"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MODE = new URLSearchParams(location.search).get("m") || "results";
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x10161b);
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xdfe9e4, 0x0b0f12, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(-6, 12, 9); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd3c0, 0.6); rim.position.set(10, 5, -9); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x10161b, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

function box(w, h, d, color, x, z, y0 = 0, rough = 0.4) {
  const r = Math.min(0.12, w / 4, d / 4, Math.max(h, 0.02) / 2.2);
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -d / 2); s.lineTo(w / 2 - r, -d / 2); s.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
  s.lineTo(w / 2, d / 2 - r); s.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2); s.lineTo(-w / 2 + r, d / 2);
  s.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r); s.lineTo(-w / 2, -d / 2 + r); s.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(h, 0.02), bevelEnabled: false, curveSegments: 8 });
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0.06 }));
  m.position.set(x, y0, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
const labels = [];
function tag(x, y, z, big, small, cls = "tag") { labels.push({ p: new THREE.Vector3(x, y, z), big, small, cls }); }
const T = (id, v) => (document.getElementById(id).textContent = v);

if (MODE === "results") {
  T("t", "What the gate verified"); T("s", "Fixes that passed the agent-built gate, and exploit variants the fixes blocked. Gemma 4 on AegisBench");
  T("f", "Every bar is a measured run; raw logs at github.com/CopyNinja07-07/aegis");
  camera.fov = 22; camera.updateProjectionMatrix(); camera.position.set(-2.5, 8.5, 30); camera.lookAt(0, 2.6, 0); camera.setViewOffset(W, H, 0, -95, W, H);
  const bars = [
    ["45 of 48", "Full agent", 45 / 48, 0x3f8f6c],
    ["0 of 32", "Route file only", 0, 0x5f7a70],
    ["27 of 32", "Call slice, 3 to 5 hops deep", 27 / 32, 0x3f8f6c],
    ["15 of 32", "Whole repository, 3 to 5 hops", 15 / 32, 0x5f7a70],
    ["89 of 89", "Held-out exploit variants blocked", 1, 0xd9a54a],
  ];
  const H0 = 5.2;
  bars.forEach(([big, small, f, col], i) => {
    const x = -6.0 + i * 3.0;
    box(1.7, 0.08, 1.7, 0x1c262d, x, 0);
    if (f > 0) box(1.4, H0 * f, 1.4, col, x, 0, 0.08);
    tag(x, 0.08 + H0 * f + 0.35, 0, big, small);
  });
} else {
  T("t", "13 real CVEs"); T("s", "Pinned to their last vulnerable releases, each one checked three ways");
  T("f", "Cubes on each tile, left to right: exploit reproduced, regression suite passes, bug reached by graph and trace. 13 of 13 each");
  camera.position.set(0, 12.5, 13.5); camera.lookAt(0, 0, 0.6); camera.setViewOffset(W, H, 0, -60, W, H);
  const cases = ["requests", "urllib3", "requests + urllib3", "waitress", "requests", "PyYAML", "Jinja2", "sqlparse", "idna", "python-multipart", "aiohttp", "Werkzeug", "Django"];
  cases.forEach((name, i) => {
    const row = i < 5 ? 0 : i < 9 ? 1 : 2, inRow = i < 5 ? i : i < 9 ? i - 5 : i - 9, n = row === 0 ? 5 : 4;
    const x = (inRow - (n - 1) / 2) * 3.0, z = -2.6 + row * 2.6;
    box(2.5, 0.42, 1.7, 0x2c3a40, x, z);
    [0x3f8f6c, 0x3f8f6c, 0xd9a54a].forEach((c, k) => box(0.56, 0.32, 0.56, c, x - 0.72 + k * 0.72, z + 0.15, 0.42));
    tag(x, 0.0, z + 1.25, "", name, "pk");
  });
}
camera.updateMatrixWorld();
for (const l of labels) {
  const v = l.p.clone().project(camera);
  const el = document.createElement("div"); el.className = l.cls;
  if (l.cls === "pk") el.textContent = l.small; else el.innerHTML = `<b>${l.big}</b><span>${l.small}</span>`;
  el.style.left = ((v.x + 1) / 2 * W) + "px"; el.style.top = ((1 - v.y) / 2 * H) + "px";
  document.body.appendChild(el);
}
renderer.render(scene, camera);
</script>
</body>
</html>
