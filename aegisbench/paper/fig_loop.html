<!doctype html>
<html><head><meta charset="utf-8"><title>OODA-Aegis loop</title>
<style>
  html,body{margin:0;background:#fff}
  svg{display:block;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .h{font-size:21px;font-weight:700;fill:#1d2a22}
  .t{font-size:16px;fill:#2f3b33}
  .s{font-size:14px;fill:#55615a}
  .lab{font-size:15px;fill:#55615a}
</style></head>
<body>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b62"/>
    </marker>
  </defs>

  <!-- Observe (trusted) -->
  <rect x="20" y="60" width="250" height="150" rx="10" fill="#e3efe7"/>
  <text class="h" x="40" y="96">Observe</text>
  <text class="t" x="40" y="128">Replay the real exploit</text>
  <text class="t" x="40" y="152">Outcome oracles judge it:</text>
  <text class="s" x="40" y="176">leak, uid=, other tenant's rows,</text>
  <text class="s" x="40" y="196">redirect, latency, 5xx</text>

  <!-- Orient -->
  <rect x="320" y="60" width="250" height="150" rx="10" fill="#e3efe7"/>
  <text class="h" x="340" y="96">Orient</text>
  <text class="t" x="340" y="128">AST call graph of the repo</text>
  <text class="t" x="340" y="152">Files within 2 hops of the</text>
  <text class="t" x="340" y="176">attacked route (2 or 3 of 31)</text>
  <text class="s" x="340" y="198">E4B names the attack class</text>

  <!-- Decide: model proposes (untrusted) then Z3 -->
  <rect x="620" y="60" width="250" height="68" rx="10" fill="#f6e7c8"/>
  <text class="h" x="640" y="90">Decide</text>
  <text class="t" x="640" y="114">Gemma 4 proposes rule, patch</text>
  <rect x="620" y="142" width="250" height="68" rx="10" fill="#e3efe7"/>
  <text class="t" x="640" y="170">Z3 checks Φ<tspan baseline-shift="sub" font-size="12">safety</tspan></text>
  <text class="s" x="640" y="192">UNSAT core names the violation</text>
  <line x1="745" y1="128" x2="745" y2="140" stroke="#5d6b62" stroke-width="2" marker-end="url(#a)"/>

  <!-- Act -->
  <rect x="920" y="60" width="260" height="150" rx="10" fill="#e3efe7"/>
  <text class="h" x="940" y="96">Act</text>
  <text class="t" x="940" y="128">Agent-built gate:</text>
  <text class="s" x="940" y="152">exploit worked before, fails after</text>
  <text class="s" x="940" y="174">legitimate responses unchanged</text>
  <text class="s" x="940" y="196">service tests pass</text>

  <!-- forward arrows -->
  <line x1="272" y1="135" x2="316" y2="135" stroke="#5d6b62" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="572" y1="135" x2="616" y2="135" stroke="#5d6b62" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="872" y1="135" x2="916" y2="135" stroke="#5d6b62" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ship -->
  <line x1="1050" y1="212" x2="1050" y2="262" stroke="#2f6b45" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="t" x="1062" y="244" style="fill:#2f6b45;font-weight:700">ship</text>
  <text class="s" x="985" y="286">scored on held-out variants</text>

  <!-- loop back -->
  <path d="M 960 212 L 960 330 L 145 330 L 145 214" fill="none" stroke="#5d6b62" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="lab" x="330" y="356">Rejected: re-observe the patched service, feed back the responses (up to 4 candidates)</text>
  <text class="lab" x="640" y="246">Z3 rejects: next candidate, else no action</text>

  <!-- legend -->
  <rect x="20" y="16" width="18" height="18" rx="4" fill="#f6e7c8"/>
  <text class="s" x="46" y="30">model output, untrusted</text>
  <rect x="230" y="16" width="18" height="18" rx="4" fill="#e3efe7"/>
  <text class="s" x="256" y="30">deterministic and trusted</text>
</svg>
</body></html>
